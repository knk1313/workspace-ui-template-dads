name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同じブランチに続けて push したときは、古い実行を取り消す（main は最後まで実行する）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # 型チェック + lint（デザイントークン検査を含む）+ 単体テスト（axe・コントラスト検査を含む）
      - run: npm run check
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # ブラウザー本体はキャッシュし、OS の依存パッケージだけを毎回入れる
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # 主要ページの表示・操作・axe（desktop / mobile の 2 幅）
      - run: npm run test:e2e

  visual:
    runs-on: ubuntu-latest
    # 基準画像を撮ったのと同じイメージで実行する（scripts/visual.sh と同じ版。@playwright/test を上げたら合わせて上げる）
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v7
      # コンテナの中では setup-node のキャッシュが使えないため、npm のキャッシュを自分で持つ
      - uses: actions/cache@v4
        with:
          path: /root/.npm
          key: npm-visual-${{ hashFiles('package-lock.json') }}
      - run: npm ci --prefer-offline --no-audit --no-fund
      # 主要な画面と開いた状態のスクリーンショットを基準画像と比べる
      - run: npx playwright test -c playwright.visual.config.ts
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-diff
          path: test-results/
          retention-days: 7

  starter:
    runs-on: ubuntu-latest
    # 見本の画面を消すスクリプト（npm run remove-samples）が、テンプレートの変更で壊れていないかを確かめる
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run remove-samples -- --force
      - run: npm run check
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # 消したあとも画面が動くかを確かめる。幅による違いは e2e ジョブで見ているため、desktop だけにする（ビルドも webServer の中で行う）
      - run: npm run test:e2e -- --project=desktop
