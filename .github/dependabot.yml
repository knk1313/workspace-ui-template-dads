# 依存パッケージの更新（Dependabot）。
# - npm は毎週、マイナーとパッチをまとめて 1 つのプルリクエストにする。メジャーは個別に出し、変更点を読んでから取り込む
# - Playwright は別にまとめる。上げるときは .github/workflows/ci.yml のイメージの版も合わせ、
#   npm run test:visual:update で基準画像を撮り直す（版がずれると npm run lint の検査で止まる）
# - GitHub Actions は毎月
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # 型は、推奨の実行環境（.nvmrc の Node.js 24）に合わせるため、メジャーは上げない
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint が TypeScript 7 に対応するまで、メジャーは上げない（対応したらこの行を消す）
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      playwright:
        patterns: ["@playwright/test", "@axe-core/playwright"]
      minor-and-patch:
        update-types: [minor, patch]
        exclude-patterns: ["@playwright/test", "@axe-core/playwright"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
